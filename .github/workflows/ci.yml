name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run release

      # package.json points `bun add github:...` installs at the committed dist/
      # bundles (bun skips the build step) — catch a source change that forgot to
      # rebuild+recommit them before it ships stale code to that install path.
      - name: Verify committed dist/ bundles are up to date
        run: git diff --exit-code -- dist/

      - run: npm run test:ci
